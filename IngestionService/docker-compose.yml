version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    environment:
      - NEO4J_URI=neo4j://neo-db:7687
      - USER_NAME=neo4j
      - PASSWORD=aziz1234
    depends_on:
      - neo-db
    container_name: my-fastapi-app

  neo-db:
    image: neo4j:4.4-community
    ports:
      - 7474:7474
      - 7473:7473
      - 7687:7687
    environment:
      NEO4J_AUTH: neo4j/aziz1234
    volumes:
      - neo4j_data:/data
    container_name: neo4j-database

volumes:
  neo4j_data:
