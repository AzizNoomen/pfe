version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    environment:
      - NEO4J_URI=neo4j://neo-db:7687
      - USER_NAME=neo4j
      - PASSWORD=aziz1234
      - OLLAMA_HOST=http://ollama:11434  # Ensure your app points to the Ollama container
    depends_on:
      - neo-db
      - ollama  # Ensure the app waits for Ollama to start
    container_name: Ingestion-Service

  neo-db:
    image: neo4j:4.4-community
    ports:
      - 7474:7474
      - 7473:7473
      - 7687:7687
    environment:
      NEO4J_AUTH: neo4j/aziz1234
    volumes:
      - neo4j_data:/data
    container_name: neo4j-database

  ollama:
    image: ollama/ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    ports:
      - 11434:11434
    volumes:
      - ollama:/root/.ollama
    restart: always
    container_name: ollama

volumes:
  neo4j_data:
  ollama:
