version: '3.8'

services:
  neo4j:
    image: neo4j:4.4
    environment:
      NEO4J_AUTH: "neo4j/aziz1234"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  ingestion_service:
    build: .
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=aziz1234
    ports:
      - "8000:8000"
      - "8000:80"

volumes:
  neo4j_data:
